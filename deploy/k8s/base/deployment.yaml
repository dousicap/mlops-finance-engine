apiVersion: apps/v1
kind: Deployment
metadata:
  name: finml-api
spec:
  replicas: 2
  revisionHistoryLimit: 5          # versions conservées pour `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # on ne retire un ancien pod qu'une fois le nouveau prêt
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics/
    spec:
      serviceAccountName: finml-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:           # évite deux réplicas sur le même nœud
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: finml-api
      topologySpreadConstraints:   # répartit les réplicas sur plusieurs zones
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: finml-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: finml-api           # remplacé par l'overlay (tag = SHA du commit)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: finml-api
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Démarrage : chargement des modèles MLflow, jusqu'à 150 s avant que les autres sondes jouent.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          # Prêt : /health renvoie 503 tant qu'un modèle manque, le pod ne reçoit alors aucun trafic.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # Vivant : le processus répond. Volontairement distinct de /health, pour ne pas
          # redémarrer en boucle un pod dont seul un modèle est indisponible.
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: prediction-logs, mountPath: /var/log/finml}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: prediction-logs
          emptyDir: {sizeLimit: 1Gi}
