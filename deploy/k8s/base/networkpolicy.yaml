# Seuls le contrôleur Ingress et Prometheus peuvent joindre l'API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finml-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finml-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
