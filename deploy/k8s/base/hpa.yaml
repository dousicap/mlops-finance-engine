apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finml-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finml-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # évite de réduire puis réaugmenter en boucle
