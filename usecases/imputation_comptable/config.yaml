name: imputation_comptable
description: Proposition du compte de charge PCG à partir du libellé d'une pièce, avec les exemples qui la justifient.
task: text_classification
registered_model: finml-imputation-comptable
target: compte

features:
  text: libelle

schema:
  libelle: {}
  compte: {allowed: ["6061", "6063", "6064", "6132", "6135", "6155", "616", "6226", "6231", "6251", "6257", "626", "627", "6185"]}

# Noms des champs de sortie de l'API : vocabulaire comptable de ce cas d'usage.
output:
  class_field: compte
  class_name_field: intitule

labels:
  "6061": Fournitures non stockables (eau, énergie)
  "6063": Fournitures d'entretien et de petit équipement
  "6064": Fournitures administratives
  "6132": Locations immobilières
  "6135": Locations mobilières
  "6155": Entretien et réparations sur biens mobiliers
  "616": Primes d'assurances
  "6226": Honoraires
  "6231": Annonces et insertions
  "6251": Voyages et déplacements
  "6257": Réceptions
  "626": Frais postaux et de télécommunications
  "627": Services bancaires et assimilés
  "6185": Frais de colloques, séminaires, conférences

# Second avis LLM pour les pièces envoyées en revue humaine (jamais d'écriture automatique).
# Activé seulement si la variable FINML_LLM_API_KEY est définie.
llm:
  prompt: prompts/second_avis_v1.md
  prompt_version: second_avis_v1
  base_url: https://api.mistral.ai/v1
  model: mistral-small-latest

data:
  generator: generate.py
  path: data/imputation_comptable.csv
  n_rows: 5000
  seed: 7

metric: accuracy
min_score: 0.80
# Sous ce niveau de confiance, la proposition part en revue humaine (a_revoir = true).
# Remplacé à l'entraînement par le seuil qui garantit la précision cible.
decision_threshold: 0.6
cv_folds: 5

# Hypothèses métier : 24 000 pièces d'achat par an, 1,5 minute de saisie manuelle par pièce,
# et 97 % de précision exigée sur les écritures passées automatiquement.
# L'historique contient environ 3 % d'erreurs d'imputation : une cible de 98 % n'automatise
# presque rien, car la précision est mesurée contre ces étiquettes imparfaites.
business:
  kind: automation
  target_precision: 0.97
  annual_volume: 24000
  minutes_per_item: 1.5


# Recherche d'hyperparamètres (Optuna) : budget par candidat. Le réglage trouvé n'est
# retenu que s'il bat le réglage de départ en validation croisée.
tuning:
  n_trials: 20
  timeout_seconds: 45

candidates:
  - name: tfidf_regression_logistique
    type: tfidf_logreg
    params: {C: 10.0}
    search: {"C": {"float": [0.1, 100.0], "log": true}}
  - name: tfidf_svm_lineaire
    type: tfidf_svm
    params: {C: 1.0}
    search: {"C": {"float": [0.05, 10.0], "log": true}}
  - name: tfidf_naive_bayes
    type: tfidf_naive_bayes
    params: {alpha: 0.1}
    search: {"alpha": {"float": [0.01, 1.0], "log": true}}
  - name: recherche_vectorielle_k5
    type: knn_retrieval
    params: {k: 5, embedder: tfidf, embedder_params: {dim: 256}}
    search: {"k": {"int": [3, 30]}}
  - name: recherche_vectorielle_k15
    type: knn_retrieval
    params: {k: 15, embedder: tfidf, embedder_params: {dim: 256}}
  # Embeddings sémantiques multilingues : décommenter après `pip install .[embeddings]`.
  # Mesuré sur ces données : accuracy 0.833 (k=5), contre 0.88 pour les n-grammes de caractères.
  # Les libellés bancaires sont courts, bruités et dominés par des noms de fournisseurs :
  # la forme compte plus que le sens. Sur des descriptions longues, le résultat s'inverse.
  # - name: recherche_semantique_minilm
  #   type: knn_retrieval
  #   params: {k: 7, embedder: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    search: {"k": {"int": [3, 30]}}
