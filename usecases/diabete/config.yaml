# Généré par `finml init diabete --csv diabetes.csv --cible progression`.
# 442 lignes. Tâche détectée : tabular_regression.
# Porte qualité : battre une référence naïve. Relire avant la mise en production.

name: diabete
description: Prédiction de progression (tabular_regression), cas créé par finml init.
task: tabular_regression
registered_model: finml-diabete
target: progression
features:
  numeric:
  - age
  - sex
  - bmi
  - bp
  - s1
  - s2
  - s3
  - s4
  - s5
  - s6
  categorical: []
schema: {}
data:
  path: usecases/diabete/donnees.csv
  n_rows: 442
  seed: 42
metric: r2
min_score: 0.0
cv_folds: 5
tuning:
  n_trials: 20
  timeout_seconds: 45
candidates:
- name: regression_lineaire
  type: linear_regression
  params: {}
- name: ridge
  type: ridge
  params:
    alpha: 1.0
  search:
    alpha:
      float:
      - 0.001
      - 100.0
      log: true
- name: lasso
  type: lasso
  params:
    alpha: 0.1
  search:
    alpha:
      float:
      - 0.0001
      - 10.0
      log: true
- name: elastic_net
  type: elastic_net
  params:
    alpha: 0.1
    l1_ratio: 0.5
  search:
    alpha:
      float:
      - 0.0001
      - 10.0
      log: true
    l1_ratio:
      float:
      - 0.05
      - 0.95
- name: svr
  type: svr
  params:
    C: 100.0
  search:
    C:
      float:
      - 1.0
      - 1000.0
      log: true
    epsilon:
      float:
      - 0.01
      - 10.0
      log: true
- name: k_plus_proches_voisins
  type: knn
  params:
    n_neighbors: 15
  search:
    n_neighbors:
      int:
      - 5
      - 75
- name: arbre_de_decision
  type: decision_tree
  params:
    max_depth: 6
    min_samples_leaf: 5
  search:
    max_depth:
      int:
      - 2
      - 12
    min_samples_leaf:
      int:
      - 1
      - 50
- name: random_forest
  type: random_forest
  params:
    n_estimators: 300
    min_samples_leaf: 3
  search:
    max_depth:
      int:
      - 4
      - 20
    min_samples_leaf:
      int:
      - 1
      - 30
    max_features:
      choice:
      - sqrt
      - 0.3
      - 0.6
- name: extra_trees
  type: extra_trees
  params:
    n_estimators: 300
    min_samples_leaf: 3
  search:
    max_depth:
      int:
      - 4
      - 20
    min_samples_leaf:
      int:
      - 1
      - 30
    max_features:
      choice:
      - sqrt
      - 0.3
      - 0.6
- name: gradient_boosting_histogramme
  type: hist_gradient_boosting
  params:
    max_iter: 300
    learning_rate: 0.05
  search:
    learning_rate:
      float:
      - 0.02
      - 0.3
      log: true
    max_depth:
      int:
      - 2
      - 10
    min_samples_leaf:
      int:
      - 10
      - 100
    l2_regularization:
      float:
      - 0.0001
      - 10.0
      log: true
- name: xgboost
  type: xgboost
  params:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
  search:
    n_estimators:
      int:
      - 100
      - 800
    max_depth:
      int:
      - 2
      - 8
    learning_rate:
      float:
      - 0.01
      - 0.3
      log: true
    subsample:
      float:
      - 0.6
      - 1.0
    colsample_bytree:
      float:
      - 0.5
      - 1.0
    min_child_weight:
      int:
      - 1
      - 20
- name: lightgbm
  type: lightgbm
  params:
    n_estimators: 300
    num_leaves: 15
    learning_rate: 0.05
  search:
    n_estimators:
      int:
      - 100
      - 800
    num_leaves:
      int:
      - 7
      - 63
    learning_rate:
      float:
      - 0.01
      - 0.3
      log: true
    subsample:
      float:
      - 0.6
      - 1.0
    colsample_bytree:
      float:
      - 0.5
      - 1.0
    min_child_samples:
      int:
      - 5
      - 100
- name: reseau_neurones_sklearn
  type: mlp
  params:
    hidden_layer_sizes:
    - 64
    - 32
    alpha: 0.001
  search:
    alpha:
      float:
      - 1.0e-05
      - 0.1
      log: true
