# Environnement local complet : serveur MLflow, base vectorielle pgvector, API.
#
#   docker compose up -d mlflow pgvector
#   MLFLOW_TRACKING_URI=http://localhost:5000 finml run-all       # entraîne et exporte models/
#   FINML_PGVECTOR_DSN=postgresql://finml:finml@localhost:5432/finml finml index-pgvector imputation_comptable
#   docker compose up -d --build api                              # http://localhost:8000/docs
#   docker compose --profile monitoring up -d                     # Prometheus :9090, Grafana :3000

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finml
      POSTGRES_PASSWORD: finml   # local uniquement : en production, AWS Secrets Manager
      POSTGRES_DB: finml
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finml"]
      interval: 10s
      retries: 5

  api:
    build: .
    image: finml-api:local
    ports: ["8000:8000"]
    depends_on: [pgvector]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    ports: ["9090:9090"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer      # lecture seule sans connexion, jamais Admin
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mlflow-data:
  pg-data:
